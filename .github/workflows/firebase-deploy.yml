name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/489381507990/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1335663638@axiomatic-spark-505611-t0.iam.gserviceaccount.com'

      # Bypassing the broken Firebase Action entirely to use standard Firebase CLI
      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project axiomatic-spark-505611-t0